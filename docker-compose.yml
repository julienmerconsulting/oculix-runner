# =============================================================================
#  OculiX Mainframe Lab
#
#  One mainframe target, TK5 (MVS 3.8j under Hercules) with KICKS 1.5.0
#  installed, pulled from GHCR: host ports 3271 / 5901 / 6081 / 8039.
#  A bare TK5 without KICKS is the same machine minus one program; it is not
#  needed here.
#
#  And the OculiX runner: HTTP API + SQLite on a warm OculiX JVM, port 8765.
# =============================================================================

services:

  # ===========================================================================
  # TK5 + KICKS
  # ===========================================================================

  target-mainframe-kicks:
    # TK5 + KICKS 1.5.0 already installed (see lab/KICKS.md). To rebuild a bare
    # TK5 and redo the installation yourself, follow the guide in lab/.
    image: ghcr.io/julienmerconsulting/target-mainframe-kicks:1.5.0-installed
    container_name: target-mainframe-kicks
    hostname: target-mainframe-kicks

    ports:
      - "3271:3270"
      - "5901:5900"
      - "6081:6080"
      - "8039:8038"

    networks:
      - lab-net

    # No automatic restart: when the WSL VM went down, everything came back at
    # once (Hercules + the runner) and brought it down again. Restart by hand.
    restart: "no"

    mem_limit: 1g
    cpus: 1.0


  # ===========================================================================
  # OCULIX RUNNER
  # ===========================================================================

  oculix-runner:
    # The Dockerfile is at the root of this repository.
    build: .
    container_name: oculix-runner
    hostname: oculix-runner

    # The runner does not depend on a target: VNC targets are rows of its base
    # (POST /projects/{id}/targets), it starts on its own.
    environment:
      RUNNER_HTTP_PORT: "8765"
      RUNNER_DEBUG_LEVEL: "3"
      # Admin key fixed at first start (otherwise generated and printed once in the logs)
      RUNNER_BOOTSTRAP_KEY: ${RUNNER_BOOTSTRAP_KEY:-}
      # VNC passwords: never in the base, referenced by name from targets.secret_ref
      # TK5_VNC_PASSWORD: ${TK5_VNC_PASSWORD:-}

    ports:
      - "8765:8765"

    volumes:
      - runner-data:/workdir

    networks:
      - lab-net

    # No automatic restart: when the WSL VM went down, everything came back at
    # once (Hercules + the runner) and brought it down again. Restart by hand.
    restart: "no"

    mem_limit: 2g
    cpus: 2.0


# =============================================================================
# INTERNAL NETWORK
# =============================================================================

networks:
  lab-net:
    driver: bridge

# SQLite base, scripts and artifacts of the runs: survive a container recreation
volumes:
  runner-data: