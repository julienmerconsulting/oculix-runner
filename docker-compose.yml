# =============================================================================
#  OculiX Mainframe Lab
#
#  Deux cibles mainframe isolees :
#
#  1. target-mainframe
#       TK5 original
#       Windows : 3270 / 5900 / 6080
#
#  2. target-mainframe-kicks
#       TK5 dedie a KICKS
#       Windows : 3271 / 5901 / 6081
#
#  Le runner OculiX reste actuellement connecte au target-mainframe original.
# =============================================================================

services:

  # ===========================================================================
  # TK5 ORIGINAL
  # ===========================================================================

  target-mainframe:
    build: ./target-mainframe
    container_name: target-mainframe
    hostname: target-mainframe

    ports:
      - "3270:3270"
      - "5900:5900"
      - "6080:6080"

    networks:
      - lab-net

    restart: unless-stopped

    mem_limit: 1g
    cpus: 1.0


  # ===========================================================================
  # TK5 + KICKS
  # ===========================================================================

  target-mainframe-kicks:
    # TK5 + KICKS 1.5.0 deja installe (voir lab/KICKS.md). Pour reconstruire un TK5 nu
    # et refaire l'installation soi-meme : remplacer image: par build: ./target-mainframe-kicks
    image: ghcr.io/julienmerconsulting/target-mainframe-kicks:1.5.0-installed
    container_name: target-mainframe-kicks
    hostname: target-mainframe-kicks

    ports:
      - "3271:3270"
      - "5901:5900"
      - "6081:6080"
      - "8039:8038"

    networks:
      - lab-net

    restart: unless-stopped

    mem_limit: 1g
    cpus: 1.0


  # ===========================================================================
  # OCULIX RUNNER
  # ===========================================================================

  oculix-runner:
    build: ./oculix-runner
    container_name: oculix-runner
    hostname: oculix-runner

    # Le runner ne depend plus d'une cible : les cibles VNC sont des lignes de
    # sa base (POST /projects/{id}/targets), il demarre seul.
    environment:
      RUNNER_HTTP_PORT: "8765"
      RUNNER_DEBUG_LEVEL: "3"
      # Cle admin fixee au premier demarrage (sinon generee et affichee une fois dans les logs)
      RUNNER_BOOTSTRAP_KEY: ${RUNNER_BOOTSTRAP_KEY:-}
      # Mots de passe VNC : jamais en base, references par nom depuis targets.secret_ref
      # TK5_VNC_PASSWORD: ${TK5_VNC_PASSWORD:-}

    ports:
      - "8765:8765"

    volumes:
      - runner-data:/workdir

    networks:
      - lab-net

    restart: unless-stopped

    mem_limit: 2g
    cpus: 2.0


# =============================================================================
# RESEAU INTERNE
# =============================================================================

networks:
  lab-net:
    driver: bridge

# Base SQLite, scripts et artefacts des runs : survivent a la recreation du conteneur
volumes:
  runner-data: